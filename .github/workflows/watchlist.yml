name: 观察名单管理
on:
  push:
    branches: [main]
    paths: ['operations/watchlist-preferences.json']
  workflow_dispatch:
    inputs:
      action:
        description: '选择忽略或恢复（只影响持续观察表）'
        type: choice
        options: [忽略, 恢复]
        default: 忽略
        required: true
      code:
        description: '六位股票代码，保留前导0，例如002780'
        type: string
        required: true
permissions:
  contents: write
concurrency:
  group: tommy-watchlist-preferences
  cancel-in-progress: false
jobs:
  preferences:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: 保存忽略或恢复选择并刷新当前观察表
        env:
          WATCHLIST_ACTION: ${{ inputs.action }}
          WATCHLIST_CODE: ${{ inputs.code }}
          GH_TOKEN: ${{ github.token }}
          REPO_NAME: ${{ github.repository }}
        run: python -m tommy_capital.watchlist
