name: A-share live screen
on:
  push:
    branches: [main]
    paths-ignore: ['results/**', '**.md']
  schedule:
    # One requested opening scan: 2026-10-08 09:50 China/Singapore (UTC+8).
    # GitHub cron has no year; the job guard prevents execution next year.
    - cron: '50 1 8 10 *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Technical scan cap (0 scans every qualified stock)'
        required: true
        default: '0'
        type: string

permissions:
  contents: write

concurrency:
  group: tommy-market-scan
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  screen:
    if: github.event_name != 'schedule' || startsWith(github.event.schedule, '50 1 8 10')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check one-time schedule date
        id: date
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != schedule ] || [ "$(TZ=Asia/Shanghai date +%F)" = 2026-10-08 ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.date.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.date.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Install
        if: steps.date.outputs.run == 'true'
        run: python -m pip install -e .
      - uses: actions/cache/restore@v4
        if: steps.date.outputs.run == 'true'
        with:
          path: .cache/tommy
          key: tommy-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: tommy-v2-${{ runner.os }}-
      - name: Fetch real A-share data and screen
        if: steps.date.outputs.run == 'true'
        env:
          SCAN_LIMIT: ${{ inputs.limit }}
        run: python -u -m tommy_capital.cli --config config.json --limit "${SCAN_LIMIT:-0}" --workers 4
      - name: 发布中文报告与机器摘要
        if: always() && steps.date.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_NAME: ${{ github.repository }}
        run: python -m tommy_capital.publish
      - uses: actions/cache/save@v4
        if: always() && steps.date.outputs.run == 'true'
        with:
          path: .cache/tommy
          key: tommy-v2-${{ runner.os }}-${{ github.run_id }}
      - name: Upload report, including failure diagnostics
        if: always() && steps.date.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tommy-capital-report
          path: reports/latest/
          if-no-files-found: warn
          retention-days: 14
