name: A-share live screen
on:
  schedule:
    # Keep the requested one-time opening scan; recurring close is 15:05 UTC+8.
    # 15:35 / 16:05 catch missed triggers. Valid daily reports suppress duplicates.
    # Holidays are checked against the real calendar after dependency install.
    - cron: '50 1 8 10 *'
    - cron: '5 7 * * 1-5'
    - cron: '35 7 * * 1-5'
    - cron: '5 8 * * 1-5'
  workflow_dispatch:
    inputs:
      phase:
        description: 'Scan phase (closing requires today complete daily/15:00 bars)'
        required: true
        default: 'closing'
        type: choice
        options: [closing, opening, auto]
      limit:
        description: 'Technical scan cap (0 scans every qualified stock)'
        required: true
        default: '0'
        type: string

permissions:
  contents: write

concurrency:
  group: tommy-market-scan
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          # Queued fallbacks must see the report published by the preceding run.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - uses: actions/cache/restore@v4
        with:
          path: .cache/tommy
          key: tommy-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: tommy-v2-${{ runner.os }}-
      - name: Check actual A-share trading day
        id: trading
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
          MANUAL_PHASE: ${{ inputs.phase }}
        run: python -m tommy_capital.market_schedule --phase "${MANUAL_PHASE:-auto}"
      - name: Fetch real A-share data and screen
        if: steps.trading.outputs.run == 'true'
        env:
          SCAN_LIMIT: ${{ inputs.limit }}
          SCAN_PHASE: ${{ steps.trading.outputs.phase }}
        run: python -u -m tommy_capital.cli --config config.json --limit "${SCAN_LIMIT:-0}" --workers 4 --scan-phase "$SCAN_PHASE" --closing-retries 2
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/tommy
          key: tommy-v2-${{ runner.os }}-${{ github.run_id }}
      - name: Upload report, including failure diagnostics
        id: artifact
        if: always() && steps.trading.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tommy-capital-report
          path: reports/latest/
          if-no-files-found: warn
          retention-days: 14
      - name: 发布中文报告与机器摘要及日期归档
        if: always() && steps.trading.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_NAME: ${{ github.repository }}
          REPORT_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: python -m tommy_capital.publish
